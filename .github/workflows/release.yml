name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python build requirements
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run safety tests
        run: python -m unittest discover -s tests -v

      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: ./packaging/Build-Installer.ps1 -UseCurrentPython -PythonCommand python

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MesterSync-Windows-Installer
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "import sys; sys.path.insert(0, 'app'); from version import APP_VERSION; print(APP_VERSION)").Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version"
          }
          gh release create "${{ github.ref_name }}" dist/installer/* --generate-notes --title "MesterSync $version"
